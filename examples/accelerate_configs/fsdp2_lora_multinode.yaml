# ../accelerate_configs/fsdp2_lora_multinode.yaml
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: "no"

fsdp_config:
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_forward_prefetch: false

  # 🔑 FSDP loading / memory tricks
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: true
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_state_dict_type: SHARDED_STATE_DICT
  fsdp_sync_module_states: true
  fsdp_use_orig_params: false

# MULTI-NODE SETTINGS
num_machines: 8          # total nodes in the job
num_processes: 32        # total processes = total GPUs (here 8 nodes × 4 GPUs)

# These will be overridden at runtime by CLI flags
machine_rank: 0
main_process_ip: "127.0.0.1"
main_process_port: 29500

main_training_function: main
mixed_precision: bf16
same_network: true
use_cpu: false
rdzv_backend: static
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
